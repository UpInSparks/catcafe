name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  GRADLE_OPTS: "--add-opens=jdk.compiler/com.sun.tools.javac.util=ALL-UNNAMED"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Java 21 einrichten
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Projekt bauen (kompilieren)
        run: ./gradlew compileJava

      - name: JUnit-Tests ausführen
        run: ./gradlew test

      - name: Formatierung prüfen (Spotless)
        run: ./gradlew spotlessCheck
